<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Tracking Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }
        
        .card h2 {
            margin: 0 0 15px 0;
            font-size: 1.3em;
            color: #fff;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        .status-online {
            background-color: #4CAF50;
        }
        
        .status-offline {
            background-color: #f44336;
        }
        
        .status-unknown {
            background-color: #ff9800;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .movement-status {
            font-size: 1.5em;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .confidence-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .timestamp {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
        }
        
        .log-container {
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .log-entry {
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #4CAF50;
        }
        
        .connection-status {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .arrow-indicator {
            font-size: 2em;
            text-align: center;
            margin: 10px 0;
        }
        
        .arrow-left::before { content: "←"; }
        .arrow-right::before { content: "→"; }
        .arrow-up::before { content: "↑"; }
        .arrow-down::before { content: "↓"; }
        .arrow-centered::before { content: "⊙"; }
        .arrow-none::before { content: "○"; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Face Tracking Dashboard</h1>
            <p>Real-time face tracking and camera control system</p>
        </div>
        
        <div class="connection-status" id="connectionStatus">
            <span class="status-indicator status-unknown"></span>
            <span id="connectionText">Connecting to WebSocket...</span>
        </div>
        
        <div class="dashboard">
            <div class="card">
                <h2>📹 Tracking Status</h2>
                <div class="movement-status" id="movementStatus">
                    <span class="arrow-indicator arrow-none"></span>
                    <span id="movementText">NO_FACE_LOCKED</span>
                </div>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
                </div>
                <div>Confidence: <span id="confidenceValue">0.00</span>%</div>
                <div class="timestamp" id="movementTimestamp">Last update: --</div>
            </div>
            
            <div class="card">
                <h2>📡 System Status</h2>
                <div>
                    <span class="status-indicator status-unknown" id="nodeStatus"></span>
                    <span id="nodeStatusText">PC Node: --</span>
                </div>
                <div class="timestamp" id="heartbeatTimestamp">Last heartbeat: --</div>
                <div class="timestamp" id="connectionTime">Connected for: --</div>
            </div>
            
            <div class="card">
                <h2>📊 Activity Log</h2>
                <div class="log-container" id="activityLog">
                    <div class="log-entry">Waiting for activity data...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class FaceTrackingDashboard {
            constructor() {
                this.socket = null;
                this.connected = false;
                this.connectionStartTime = null;
                this.maxLogEntries = 50;
                
                this.initializeWebSocket();
                this.updateConnectionTime();
            }
            
            initializeWebSocket() {
                // Connect to WebSocket server
                this.socket = io('ws://localhost:9002', {
                    transports: ['websocket'],
                    upgrade: false
                });
                
                this.socket.on('connect', () => {
                    this.connected = true;
                    this.connectionStartTime = Date.now();
                    this.updateConnectionStatus(true);
                    this.addLogEntry('Connected to WebSocket server', 'success');
                });
                
                this.socket.on('disconnect', () => {
                    this.connected = false;
                    this.updateConnectionStatus(false);
                    this.addLogEntry('Disconnected from WebSocket server', 'error');
                });
                
                this.socket.on('movement_update', (data) => {
                    this.handleMovementUpdate(data);
                });
                
                this.socket.on('heartbeat_update', (data) => {
                    this.handleHeartbeatUpdate(data);
                });
                
                this.socket.on('connect_error', (error) => {
                    this.updateConnectionStatus(false);
                    this.addLogEntry(`Connection error: ${error}`, 'error');
                });
            }
            
            handleMovementUpdate(data) {
                const { status, confidence, timestamp } = data;
                
                // Update movement status
                const statusElement = document.getElementById('movementText');
                const arrowElement = document.querySelector('.arrow-indicator');
                
                statusElement.textContent = status;
                
                // Update arrow indicator
                arrowElement.className = 'arrow-indicator';
                switch(status) {
                    case 'MOVE_LEFT':
                        arrowElement.classList.add('arrow-left');
                        break;
                    case 'MOVE_RIGHT':
                        arrowElement.classList.add('arrow-right');
                        break;
                    case 'MOVE_UP':
                        arrowElement.classList.add('arrow-up');
                        break;
                    case 'MOVE_DOWN':
                        arrowElement.classList.add('arrow-down');
                        break;
                    case 'CENTERED':
                        arrowElement.classList.add('arrow-centered');
                        break;
                    default:
                        arrowElement.classList.add('arrow-none');
                }
                
                // Update confidence
                const confidencePercent = (confidence * 100).toFixed(1);
                document.getElementById('confidenceValue').textContent = confidencePercent;
                document.getElementById('confidenceFill').style.width = `${confidencePercent}%`;
                
                // Update timestamp
                document.getElementById('movementTimestamp').textContent = 
                    `Last update: ${new Date(timestamp * 1000).toLocaleTimeString()}`;
                
                // Add to log
                this.addLogEntry(`Movement: ${status} (confidence: ${confidencePercent}%)`, 'info');
            }
            
            handleHeartbeatUpdate(data) {
                const { node, status, timestamp } = data;
                
                // Update node status
                const statusElement = document.getElementById('nodeStatus');
                const statusTextElement = document.getElementById('nodeStatusText');
                
                statusElement.className = 'status-indicator';
                if (status === 'ONLINE') {
                    statusElement.classList.add('status-online');
                    statusTextElement.textContent = `PC Node: ${status}`;
                } else {
                    statusElement.classList.add('status-offline');
                    statusTextElement.textContent = `PC Node: ${status}`;
                }
                
                // Update heartbeat timestamp
                document.getElementById('heartbeatTimestamp').textContent = 
                    `Last heartbeat: ${new Date(timestamp * 1000).toLocaleTimeString()}`;
            }
            
            updateConnectionStatus(connected) {
                const statusElement = document.getElementById('connectionStatus');
                const statusIndicator = statusElement.querySelector('.status-indicator');
                const statusText = document.getElementById('connectionText');
                
                if (connected) {
                    statusIndicator.className = 'status-indicator status-online';
                    statusText.textContent = 'Connected to WebSocket';
                } else {
                    statusIndicator.className = 'status-indicator status-offline';
                    statusText.textContent = 'Disconnected from WebSocket';
                }
            }
            
            updateConnectionTime() {
                setInterval(() => {
                    if (this.connected && this.connectionStartTime) {
                        const connectedTime = Date.now() - this.connectionStartTime;
                        const seconds = Math.floor(connectedTime / 1000);
                        const minutes = Math.floor(seconds / 60);
                        const hours = Math.floor(minutes / 60);
                        
                        let timeString = '';
                        if (hours > 0) {
                            timeString = `${hours}h ${minutes % 60}m ${seconds % 60}s`;
                        } else if (minutes > 0) {
                            timeString = `${minutes}m ${seconds % 60}s`;
                        } else {
                            timeString = `${seconds}s`;
                        }
                        
                        document.getElementById('connectionTime').textContent = `Connected for: ${timeString}`;
                    }
                }, 1000);
            }
            
            addLogEntry(message, type = 'info') {
                const logContainer = document.getElementById('activityLog');
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                
                const timestamp = new Date().toLocaleTimeString();
                entry.innerHTML = `<strong>${timestamp}</strong> - ${message}`;
                
                // Add to top of log
                logContainer.insertBefore(entry, logContainer.firstChild);
                
                // Remove old entries if too many
                while (logContainer.children.length > this.maxLogEntries) {
                    logContainer.removeChild(logContainer.lastChild);
                }
            }
        }
        
        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new FaceTrackingDashboard();
        });
    </script>
</body>
</html>
